name: itechorbit-local
services:
  ssr:
    image: node:24-alpine
    init: true
    working_dir: /app
    command: [node, bootstrap/ssr/ssr.js]
    environment:
      INERTIA_SSR_HOST: 0.0.0.0
    volumes:
      - ../:/app:ro
    networks:
      application:
        aliases: [itechorbit-ssr]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:13714/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
networks:
  application:
    external: true
    name: ${ITECHORBIT_DOCKER_NETWORK:-php-workspace_app_network}
