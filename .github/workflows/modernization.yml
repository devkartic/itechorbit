name: iTechOrbit verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: itechorbit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    defaults:
      run:
        working-directory: .
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8010
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DATABASE_URL: ''
      CACHE_DRIVER: array
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      INERTIA_SSR_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, dom, fileinfo, gd
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer audit
      - run: npm ci
      - run: npm audit
      - run: vendor/bin/pint --test
      - run: php artisan test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-php-${{ matrix.php }}
          path: |
            playwright-report
            test-results
          retention-days: 7
