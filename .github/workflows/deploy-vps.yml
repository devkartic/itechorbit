name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and deploy'
        type: string
        required: true
        default: production-version
      run_migrations:
        description: 'Apply reviewed database migrations (take a backup first)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_PATH: ${{ vars.VPS_PATH }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
      RUN_MIGRATIONS: ${{ inputs.run_migrations }}
    steps:
      - name: Check out deployment tools
        uses: actions/checkout@v4
        with:
          path: deployment-tools

      - name: Check out application branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: application

      - name: Identify deployment release
        run: echo "RELEASE_ID=$(git -C application rev-parse HEAD)-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Configure SSH and validate settings
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          VPS_PATH=${VPS_PATH%/}
          [[ "$VPS_PATH" =~ ^/[a-zA-Z0-9/_-]+$ && "$VPS_PATH" != / ]]
          echo "VPS_PATH=$VPS_PATH" >> "$GITHUB_ENV"
          [[ "$HEALTHCHECK_URL" == https://* ]]
          test -n "$SSH_KEY"
          if [[ -z "$KNOWN_HOSTS" ]]; then
            echo '::error::Add the production environment secret VPS_KNOWN_HOSTS (check the spelling).'
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          host_lookup=$VPS_HOST
          if [[ "$VPS_PORT" != 22 ]]; then
            host_lookup="[$VPS_HOST]:$VPS_PORT"
          fi
          # Accept either verified known_hosts entries or a public host key
          # copied directly from the trusted VPS console. Never scan-and-trust.
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' | awk -v host="$host_lookup" '
            $1 ~ /^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521))$/ {
              print host, $1, $2
              next
            }
            { print }
          ' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          if ! ssh-keygen -F "$host_lookup" -f ~/.ssh/known_hosts > /dev/null; then
            echo '::error::VPS_KNOWN_HOSTS does not match VPS_HOST/VPS_PORT. Save the server public host key from /etc/ssh/ssh_host_ed25519_key.pub in the production environment secret VPS_KNOWN_HOSTS.'
            exit 1
          fi
          if ! ssh-keygen -l -f ~/.ssh/known_hosts > /dev/null 2>&1; then
            echo '::error::VPS_KNOWN_HOSTS is not a valid SSH host key. Paste the complete public host key line, not its fingerprint or a private key.'
            exit 1
          fi
          cat > ~/.ssh/config <<EOF
          Host production-vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload the selected commit
        run: |
          set -euo pipefail
          git -C application archive --format=tar.gz --output="$RUNNER_TEMP/release.tar.gz" HEAD
          ssh production-vps "mkdir -p '$VPS_PATH.deploy/incoming'"
          scp "$RUNNER_TEMP/release.tar.gz" "production-vps:$VPS_PATH.deploy/incoming/$RELEASE_ID.tar.gz"

      - name: Build and activate release
        run: |
          set -euo pipefail
          ssh production-vps bash -s -- \
            "$VPS_PATH" "$RELEASE_ID" "$RUN_MIGRATIONS" \
            < deployment-tools/deploy/deploy-vps.sh

      - name: Check public application health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            --retry-all-errors --connect-timeout 10 --max-time 30 "$HEALTHCHECK_URL"

      - name: Remove runner SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/config ~/.ssh/known_hosts
