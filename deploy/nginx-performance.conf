# Include inside this application's server block.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml;

# Content-hashed Vite assets are safe to retain across releases.
location /build/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
